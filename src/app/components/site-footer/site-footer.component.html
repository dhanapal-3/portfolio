<footer
  class="relative z-10 border-t border-white/[0.07] bg-surface/[0.85] px-5 py-16 backdrop-blur-2xl backdrop-saturate-150 sm:px-8 lg:px-12"
>
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-neon-fuchsia/30 to-transparent"
  ></div>

  <div class="section-inner flex flex-col gap-12 lg:flex-row lg:items-center lg:justify-between">
    <div class="max-w-md">
      <div class="font-display text-2xl font-bold tracking-tight text-white">{{ profile.name }}</div>
      <p class="mt-3 text-[15px] leading-relaxed text-zinc-500">{{ profile.role }}</p>
    </div>

    <nav
      class="flex flex-wrap items-center gap-x-10 gap-y-4 text-[13px] font-semibold uppercase tracking-[0.22em] text-zinc-500"
      aria-label="Footer"
    >
      <a href="#hero" class="transition duration-300 hover:text-neon-cyan">Index</a>
      <a href="#projects" class="transition duration-300 hover:text-neon-fuchsia">Work</a>
      <a href="#contact" class="transition duration-300 hover:text-neon-violet">Contact</a>
    </nav>

    <div class="text-right lg:max-w-xs">
      <p class="text-[12px] leading-relaxed text-zinc-600">
        © {{ year }} {{ profile.name.split(' ')[0] }}. Built with Angular &amp; Tailwind — crafted for clarity.
      </p>
    </div>
  </div>
</footer>
